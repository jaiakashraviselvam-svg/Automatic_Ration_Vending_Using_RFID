<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration — Ration System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --blue: #3b82f6;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
        .header p { color: #94a3b8; font-size: 0.95rem; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }
        input, select, textarea {
            width: 100%; padding: 0.85rem; border-radius: 12px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border);
            color: #fff; font-size: 0.95rem; box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--blue); outline: none; }
        
        .btn-register {
            width: 100%; padding: 1rem; border-radius: 12px;
            background: var(--blue); color: #fff; border: none;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            margin-top: 1rem; transition: transform 0.2s, background 0.2s;
        }
        .btn-register:hover { background: #2563eb; transform: translateY(-2px); }
        
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8; }
        .footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
        
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Register Citizen</h1>
            <p>Enter your details to apply for a Ration Card</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="username" required placeholder="e.g. Anjali Devi">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="phone" required placeholder="10-digit number">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" rows="3" required placeholder="Building, Street, Area..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" name="pincode" required placeholder="600xxx">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="state" value="Tamil Nadu" readonly>
                </div>
            </div>

            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" value="India" readonly>
            </div>

            <button type="submit" class="btn-register">Apply for Registration</button>
        </form>

        <div class="footer">
            Already registered? <a href="{{ url_for('main.login') }}">Login here</a>
        </div>
    </div>
</body>
</html>
